name: Android build
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_path" --licenses >/dev/null
          "$sdkmanager_path" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch pinned TwoYi runtime assets
        run: ./scripts/fetch_twoyi_runtime.sh
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.13'
          arguments: assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: virtualos-container-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
